version: "2"

sql:
  - schema: "internal/migrations"
    queries: "internal/repository/postgres/sql"
    engine: "postgresql"

    gen:
      go:
        package: "generated"
        out: "internal/repository/postgres/generated"
        sql_package: "pgx/v5"
        emit_interface: true

        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
            nullable: true

          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
            nullable: false