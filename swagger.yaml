openapi: 3.0.3

info:
  title: FundGo API
  description: Crowdfunding REST API
  version: 1.0.0

servers:
  - url: https://fundgo.onrender.com
    description: Production server

  - url: http://localhost:8080
    description: Local server

tags:
  - name: Health
    description: Service health check

  - name: Auth
    description: Authentication and authorization

  - name: Users
    description: User management

  - name: Campaigns
    description: Crowdfunding campaigns

  - name: Donations
    description: Donations and refunds

  - name: Wallet
    description: User wallet operations

components:

  securitySchemes:

    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:

    Error:
      type: object
      properties:
        error:
          type: string
          example: validation failed


    RegistrationInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password

      properties:
        firstName:
          type: string
          minLength: 3
          maxLength: 50
          example: Alibek

        lastName:
          type: string
          minLength: 3
          maxLength: 50
          example: Userov

        email:
          type: string
          format: email
          example: alibek@example.com

        password:
          type: string
          format: password
          minLength: 6
          example: password123


    SignIn:
      type: object
      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email
          example: alibek@example.com

        password:
          type: string
          format: password
          minLength: 6
          example: password123


    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJSUzI1NiIs...

        refresh_token:
          type: string
          example: eyJhbGciOiJSUzI1NiIs...


    UserResponse:
      type: object
      properties:
        firstName:
          type: string
          example: Alibek

        lastName:
          type: string
          example: Userov

        email:
          type: string
          format: email
          example: alibek@example.com

        id:
          type: integer
          format: int64
          example: 1

        balance:
          type: number
          format: double
          example: 5000.00

        createdAt:
          type: string
          format: date-time
          example: 2026-08-26T12:00:00Z

        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null


    UserInfo:
      type: object
      required:
        - firstName
        - lastName

      properties:
        firstName:
          type: string
          minLength: 3
          maxLength: 50
          example: Alibek

        lastName:
          type: string
          minLength: 3
          maxLength: 50
          example: Userov


    UserEmail:
      type: object
      required:
        - email

      properties:
        email:
          type: string
          format: email
          example: newemail@example.com


    ChangeUserPassword:
      type: object
      required:
        - password

      properties:
        password:
          type: string
          format: password
          minLength: 6
          example: newpassword123


    CreateCampaignInput:
      type: object
      required:
        - title
        - description
        - targetAmount

      properties:
        title:
          type: string
          minLength: 3
          maxLength: 75
          example: Help build a school

        description:
          type: string
          minLength: 5
          example: We are raising money to build a new school.

        targetAmount:
          type: number
          format: double
          example: 100000.00


    DonateInput:
      type: object
      required:
        - campaignID
        - amount

      properties:
        campaignID:
          type: integer
          format: int64
          example: 1

        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 1000.00


    BalanceOperationInput:
      type: object
      required:
        - amount

      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 5000.00


    Campaign:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1

        title:
          type: string
          example: Help build a school

        description:
          type: string
          example: We are raising money to build a new school.

        targetAmount:
          type: number
          format: double
          example: 100000.00